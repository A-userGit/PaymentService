server:
  port: 80
spring:
  application:
    name: payment-service
    port: 80
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-service
          jwk-set-uri: http://auth-service/oauth2/jwks
  kafka:
    bootstrap-servers: http://kafka:9092
    trusted-packages: com.innowise.external.dto.kafka

feign:
  payment:
    provider:
      url: http://www.randomnumberapi.com/api/v1.0
      payment-endpoint: /random?min=0&max=10&count=1
      name: external-payment-provider

kafka:
  topic:
    payment-result-topic: payment.result.msg
    order-created-topic: order.created.msg

springdoc:
  swagger-ui:
    csrf:
      enabled: true
swagger-server: http://gateway-service/api/v1/payments-swagger/

mongo:
  client-uri: mongodb://admin:admin@mongo:27017/payment_service?authSource=admin
  username: admin
  password: admin
  connection-uri: mongodb://mongo:27017/payment_service?authSource=admin

liquibase:
  enabled: true
  change-log: db/changelog-master.yaml

otel:
  traces:
    sampler: always_on
  exporter:
    otlp:
      traces:
        endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
        protocol: grpc
      metrics:
        endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
        protocol: grpc
      logs:
        endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
        protocol: grpc